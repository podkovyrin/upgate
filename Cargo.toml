[workspace]
resolver = "3"
default-members = ["crates/upnow-cli"]
members = [
    "crates/upnow-cli",
    "crates/upnow-domain",
    "crates/upnow-execution",
    "crates/upnow-infra",
    "crates/upnow-audit",
    "crates/upnow-release",
    "crates/upnow-planning",
    "crates/upnow-managers",
    "crates/upnow-presentation",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
