[workspace]
resolver = "3"
default-members = ["crates/upgate-cli"]
members = [
    "crates/upgate-cli",
    "crates/upgate-domain",
    "crates/upgate-execution",
    "crates/upgate-infra",
    "crates/upgate-audit",
    "crates/upgate-release",
    "crates/upgate-planning",
    "crates/upgate-managers",
    "crates/upgate-presentation",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
