[package]
name = "upgate-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "upgate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
toml_edit = "0.25.12"
upgate-audit = { path = "../upgate-audit" }
upgate-domain = { path = "../upgate-domain" }
upgate-execution = { path = "../upgate-execution" }
upgate-infra = { path = "../upgate-infra" }
upgate-managers = { path = "../upgate-managers" }
upgate-planning = { path = "../upgate-planning" }
upgate-presentation = { path = "../upgate-presentation" }
upgate-release = { path = "../upgate-release" }

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
