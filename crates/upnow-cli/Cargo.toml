[package]
name = "upnow-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "upnow"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
upnow-domain = { path = "../upnow-domain" }
upnow-execution = { path = "../upnow-execution" }
upnow-infra = { path = "../upnow-infra" }
upnow-managers = { path = "../upnow-managers" }
upnow-planning = { path = "../upnow-planning" }
upnow-presentation = { path = "../upnow-presentation" }
upnow-release = { path = "../upnow-release" }

[dev-dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
