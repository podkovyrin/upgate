[upnow]
scan_old_age_threshold = "30d"

[brew]
mode = "apply"
min_release_age = "12h"
version_policy = "stable"
no_update = true

[brew.selection]
mode = "include"
except = ["aom", "docker"]

[npm]
mode = "plan"
min_release_age = "7d"
version_policy = "same-track"

[npm.selection]
mode = "include"
except = ["npm"]

[gem]
mode = "off"
min_release_age = "7d"

[gem.selection]
mode = "include"
except = ["bundler"]

[dotnet]
mode = "off"
min_release_age = "7d"

[dotnet.selection]
mode = "include"
except = ["serilog"]
